name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    name: CI / verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            .config/dotnet-tools.json

      - name: Restore
        run: dotnet restore ECommBackend.slnx

      - name: Build Release
        run: dotnet build ECommBackend.slnx --configuration Release --no-restore

      - name: Run all tests
        run: >-
          dotnet test ECommBackend.slnx --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=ci-tests.trx"
          --results-directory TestResults

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Check for pending EF model changes
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project ECommBackend.csproj --startup-project ECommBackend.csproj --context SQLiteConn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: CI / docker
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ecommbackend
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=tag

      - name: Consumer image metadata
        id: consumer-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ecommbackend-consumer
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=tag

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build consumer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ConsumerProject/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.consumer-meta.outputs.tags }}
          labels: ${{ steps.consumer-meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=consumer
          cache-to: type=gha,mode=max,scope=consumer
